# ProGuard Configuration File
# Bỏ qua warning về Java standard library (sẽ có sẵn khi chạy trên server)
-dontwarn java.**
-dontwarn javax.**
# Bỏ qua warning về Android và các platform khác (OkHttp có thể reference nhưng không cần)
-dontwarn org.bouncycastle.**
-dontwarn org.conscrypt.**
-dontwarn dalvik.**
-dontwarn android.**
-dontwarn sun.misc.Unsafe
-dontwarn sun.security.ssl.**
-dontwarn java.nio.file.Files
-dontwarn java.sql.Date

# QUAN TRỌNG: Không xóa các class không được sử dụng trực tiếp (OkHttp có thể được load động)
# Đặt -dontshrink TRƯỚC các keep rules để đảm bảo không xóa bất kỳ class nào
-dontshrink

# Giữ lại toàn bộ enum classes (bao gồm inner enums) - KHÔNG obfuscate
-keep enum * {
    *;
}

# Giữ lại tên enum classes (không đổi tên)
-keepnames enum * {
    *;
}

# Giữ lại enum methods cho tất cả enum (kể cả inner enums)
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
    public int ordinal();
    public java.lang.String name();
}

# Keep cụ thể các enum classes trong manager package
-keep class com.example.pvpscheduler.manager.RewardManager$Reward$Rarity {
    *;
}

-keep class com.example.pvpscheduler.manager.NotificationManager$NotificationType {
    *;
}

# Giữ lại các class cần thiết cho Bukkit (chỉ keep structure, cho phép obfuscate names)
# Main class - chỉ keep public methods và constructor
-keep public class com.example.pvpscheduler.PvPScheduler {
    public <init>(...);
    public void onEnable();
    public void onDisable();
    public *;
}
-keep class com.example.pvpscheduler.PvPScheduler$* {
    *;
}

# Commands - chỉ keep structure
-keep public class com.example.pvpscheduler.command.** {
    public <init>(...);
    public boolean onCommand(...);
    public java.util.List onTabComplete(...);
}

# Listeners - chỉ keep structure
-keep public class com.example.pvpscheduler.listener.** {
    public <init>(...);
    @org.bukkit.event.EventHandler *;
}

# Manager classes - KHÔNG KEEP (cho phép obfuscate hoàn toàn)
# Chỉ keep enum methods để tránh lỗi
-keepclassmembers class com.example.pvpscheduler.manager.**$*$* {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# Model classes - KHÔNG KEEP (cho phép obfuscate hoàn toàn)

# Util classes - KHÔNG KEEP (cho phép obfuscate hoàn toàn, như ConfigUtil sẽ được obfuscate)

# License classes - KHÔNG KEEP (cho phép obfuscate hoàn toàn)
# LicenseClient sẽ được obfuscate thành tên với I, l, 1, O, 0

# Security classes - KHÔNG KEEP (cho phép obfuscate hoàn toàn)

# Keep OkHttp và các dependencies của nó (đã được shade vào JAR)
# QUAN TRỌNG: Phải keep cả tên class và members để tránh ClassNotFoundException
# Keep toàn bộ OkHttp (bao gồm inner classes như OkHttpClient$Builder)
# Sử dụng -keep để giữ nguyên class và -keepnames để giữ nguyên tên
-keep class okhttp3.** {
    *;
}
-keepnames class okhttp3.** {
    *;
}
# Keep cụ thể inner classes của OkHttpClient (bao gồm Builder)
-keep class okhttp3.OkHttpClient$* {
    *;
}
-keepnames class okhttp3.OkHttpClient$* {
    *;
}
# Keep cụ thể OkHttpClient$Builder
-keep class okhttp3.OkHttpClient$Builder {
    *;
}
-keepnames class okhttp3.OkHttpClient$Builder {
    *;
}
-keep class okio.** {
    *;
}
-keepnames class okio.** {
    *;
}
-keep class kotlin.** {
    *;
}
-keepnames class kotlin.** {
    *;
}
-keep class kotlinx.** {
    *;
}
-keepnames class kotlinx.** {
    *;
}
-keep class org.jetbrains.annotations.** {
    *;
}
-keepnames class org.jetbrains.annotations.** {
    *;
}
# Đảm bảo OkHttp không bị xóa bằng cách keep tất cả members
-keepclassmembers class okhttp3.** {
    *;
}
-keepclassmembers class okio.** {
    *;
}

# Keep Gson và các dependencies của nó (đã được shade vào JAR)
-keep class com.google.gson.** {
    *;
}
-keepnames class com.google.gson.** {
    *;
}
-keepclassmembers class com.google.gson.** {
    *;
}

# Keep ASM classes (được sử dụng bởi StackMapFrameGenerator)
-keep class org.objectweb.asm.** {
    *;
}
-keepnames class org.objectweb.asm.** {
    *;
}
-keepclassmembers class org.objectweb.asm.** {
    *;
}

# Giữ lại các annotation và metadata cần thiết
-keepattributes *Annotation*
-keepattributes Signature
-keepattributes Exceptions
# QUAN TRỌNG: Giữ SourceFile để decompiler có thể hiển thị comment synthetic
# Nhưng tên file sẽ bị obfuscate, tạo ra comment // $FF: synthetic field khi decompile
-keepattributes SourceFile,LineNumberTable
-keepattributes EnclosingMethod
-keepattributes StackMapTable
# Giữ Synthetic attributes để tạo synthetic fields/methods (sẽ hiển thị // $FF: synthetic field khi decompile)
-keepattributes Synthetic

# Obfuscate tên class và method với dictionary
-obfuscationdictionary obfuscation-dictionary.txt
-classobfuscationdictionary obfuscation-dictionary.txt
-packageobfuscationdictionary obfuscation-dictionary.txt

# Tắt optimization để tránh lỗi incomplete class hierarchy với Bukkit API
-dontoptimize
# Tắt preverification vì gặp lỗi incomplete class hierarchy
# Sẽ dùng ASM hoặc tool khác để generate stackmap frames sau
-dontpreverify

# Obfuscate mạnh (không optimize)
-allowaccessmodification
-repackageclasses ''
# REMOVED: -overloadaggressively - Gây lỗi "Duplicate key" khi Paper plugin remapper cố gắng remap
# Vì JVM cho phép 2 fields cùng tên nhưng khác type, nhưng Paper remapper không xử lý được
-useuniqueclassmembernames
-dontskipnonpubliclibraryclasses
-dontskipnonpubliclibraryclassmembers

# QUAN TRỌNG: Cho phép obfuscate class names (không chỉ methods)
# Sử dụng -keepnames thay vì -keep để cho phép obfuscate names
# Nhưng vẫn giữ structure để code hoạt động

# Bỏ qua warnings (sẽ có sẵn khi chạy trên server)
-ignorewarnings

# Bỏ qua incomplete class hierarchy (Bukkit API có thể không đầy đủ trong library jars)
# QUAN TRỌNG: Cần bỏ qua lỗi incomplete class hierarchy để preverification có thể chạy
-dontwarn org.bukkit.entity.Entity
-dontwarn org.bukkit.projectiles.ProjectileSource
-dontwarn org.bukkit.**
# Bỏ qua lỗi khi ProGuard không tìm thấy common superclass
-dontwarn proguard.evaluation.IncompleteClassHierarchyException

# Bỏ qua warning về unresolved references (sẽ có sẵn khi chạy)
-dontwarn org.bukkit.Material

# Bỏ qua warning về enum methods (sẽ có sẵn khi chạy)
-dontwarn com.example.pvpscheduler.manager.RewardManager$Reward$Rarity
-dontwarn com.example.pvpscheduler.manager.NotificationManager$NotificationType

# Giữ lại các method cần thiết cho Bukkit
-keepclassmembers class * {
    @org.bukkit.event.EventHandler *;
}

-keepclassmembers class * implements org.bukkit.command.CommandExecutor {
    *;
}

-keepclassmembers class * implements org.bukkit.command.TabCompleter {
    *;
}

-keepclassmembers class * implements org.bukkit.event.Listener {
    *;
}

# Giữ lại các method public và constructor
-keepclassmembers class * {
    public <init>(...);
    public <methods>;
}

# FIX: Giữ lại tên fields của LicenseConfig để tránh duplicate key conflict
# Lỗi: Duplicate key IlOOlll1l (attempted merging values private final Ol011OOOOO1/IlOOlll1l Ljava/util/UUID; and private final Ol011OOOOO1/IlOOlll1l Ljava/lang/String;)
-keepclassmembers class com.example.pvpscheduler.config.LicenseConfig {
    public *;
    private *;
}

# Note: ProGuard mặc định giữ lại tất cả resources (plugin.yml, config.yml, etc.)
# Không cần thêm option đặc biệt

